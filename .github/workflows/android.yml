name: Build ESSGOO Toolbox APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Klonowanie repozytorium
        uses: actions/checkout@v4

      - name: Rozpakowanie ZIP (jeśli projekt jest w pliku zip)
        run: |
          # Jeśli w repozytorium leży plik zip, rozpakuj go
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Znaleziono archiwum $ZIP_FILE - rozpakowywanie..."
            unzip -o "$ZIP_FILE"
          fi

          # Jeśli rozpakowało do podfolderu ESSGOO-Toolbox, przejdźmy lub przenieśmy
          if [ -d "ESSGOO-Toolbox" ] && [ ! -f "build.gradle" ]; then
            cp -r ESSGOO-Toolbox/* .
          fi

      - name: Utworzenie brakującego AndroidManifest.xml (jeśli brak)
        run: |
          mkdir -p app/src/main
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "Generowanie brakującego AndroidManifest.xml w locie..."
            cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="ESSGOO Toolbox"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          fi

      - name: Konfiguracja Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Konfiguracja Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Przygotowanie gradlew
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Kompilacja APK (assembleDebug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Udostępnienie gotowego APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ESSGOO-Toolbox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
